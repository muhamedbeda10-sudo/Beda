name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npx vite build
        env:
          # Firebase web config is public by design (safe to expose in client builds)
          VITE_FIREBASE_API_KEY: AIzaSyBu_9dQ4vNPwfG4mkA4Ky5wnZl0LxXRiaY
          VITE_FIREBASE_AUTH_DOMAIN: linkmisr-9afbd.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: linkmisr-9afbd
          VITE_FIREBASE_STORAGE_BUCKET: linkmisr-9afbd.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "200160743300"
          VITE_FIREBASE_APP_ID: "1:200160743300:web:154f5edb9b7203c5f797d1"
          VITE_FIREBASE_USE_STORAGE: "false"
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINKMISR }}
          channelId: live
          projectId: linkmisr-9afbd

      # Publish security rules so schema changes and their rules ship together.
      # Runs after hosting so a rules failure never blocks the app deploy.
      - name: Write service account credentials
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINKMISR }}

      - name: Deploy Firestore rules
        id: firestore_rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project linkmisr-9afbd --non-interactive

      # Storage requires the Blaze plan; skip quietly if the bucket isn't set up.
      - name: Deploy Storage rules (optional)
        id: storage_rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@13 deploy --only storage --project linkmisr-9afbd --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

      # Never fail the release over rules, but never fail silently either.
      # Each rule set reports its own cause — they fail for different reasons.
      - name: Report skipped Firestore rules
        if: steps.firestore_rules.outcome == 'failure'
        run: |
          echo "::warning title=Firestore rules were NOT published::The app deployed fine, but firestore.rules could not be published. If the log shows HTTP 403 from firebaserules.googleapis.com, grant the deploy service account the 'Firebase Rules Admin' role in Google Cloud IAM and re-run. Until then, paste firestore.rules into the Firebase console manually."

      - name: Report skipped Storage rules
        if: steps.storage_rules.outcome == 'failure'
        run: |
          echo "::notice title=Storage rules skipped::storage.rules was not published, which is expected while Cloud Storage is not provisioned (it requires the Blaze plan). The app stores images in Firestore in this mode, so nothing is broken. Enable Storage and set VITE_FIREBASE_USE_STORAGE=true to switch.""
