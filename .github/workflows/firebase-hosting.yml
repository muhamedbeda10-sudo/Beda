name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npx vite build
        env:
          # Firebase web config is public by design (safe to expose in client builds)
          VITE_FIREBASE_API_KEY: AIzaSyBu_9dQ4vNPwfG4mkA4Ky5wnZl0LxXRiaY
          VITE_FIREBASE_AUTH_DOMAIN: linkmisr-9afbd.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: linkmisr-9afbd
          VITE_FIREBASE_STORAGE_BUCKET: linkmisr-9afbd.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "200160743300"
          VITE_FIREBASE_APP_ID: "1:200160743300:web:154f5edb9b7203c5f797d1"
          VITE_FIREBASE_USE_STORAGE: "true"
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LINKMISR }}
          channelId: live
          projectId: linkmisr-9afbd
